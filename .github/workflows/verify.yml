name: Verify delivery review

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: moon fmt --check
      - run: moon check --deny-warn
      - run: moon test --deny-warn
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js --release
      - name: Compare the monthly and follow-up reports
        run: |
          cli=_build/js/release/build/dock-review/dock-review.js
          node "$cli" sample-ledger/november.json | diff -u sample-ledger/expected/november.json -
          node "$cli" sample-ledger/event-setup.json --follow-up 2026-11-20 | diff -u sample-ledger/expected/event-follow-up.json -
          node "$cli" sample-ledger/production-week.json > /dev/null
